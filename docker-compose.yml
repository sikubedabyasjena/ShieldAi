services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shieldai
      POSTGRES_USER: shieldai
      POSTGRES_PASSWORD: shieldai_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shieldai -d shieldai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - shieldai_pgdata:/var/lib/postgresql/data

volumes:
  shieldai_pgdata: